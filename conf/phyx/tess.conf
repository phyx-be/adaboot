#
# Board-specific conf fragment for tess (Phyx Tess, Allwinner T113-S3).
#
# Applied by boot/zephyr/sysbuild/CMakeLists.txt after conf/adaboot.conf.

# The flash map is on the SD card: tess-zephyr's flash-on-disk device
# (dts/phyx/tess.dtsi) on the card's disk.
CONFIG_FLASH=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# No usable button: the BOOT button holds the SD card clock low. Enter the
# update mode on the application's request (reset_to_bootloader() /
# RunMode.UF2, the 1200 baud touch), through the boot mode in the RTC, or
# by pressing reset twice. The RTC keeps it over a reset.
CONFIG_MCUBOOT_UF2_ENTRANCE_GPIO=n
CONFIG_MCUBOOT_UF2_ENTRANCE_BOOT_MODE=y
CONFIG_MCUBOOT_UF2_ENTRANCE_DOUBLE_TAP=y

# UF2 files as large as the 4 MiB slot, and heap for their block bitmap
CONFIG_MCUBOOT_UF2_MAX_BLOCKS=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384

# MCUboot runs from RAM, so its drive may write its own partition: the
# whole boot chain (dts/phyx/tess.dtsi), to set up or repair a card.
CONFIG_MCUBOOT_UF2_WRITABLE_BOOTLOADER=y

# Erase only what a UF2 file writes: the boot partition also holds the
# partition table and the SPL, which a file with only MCUboot or the
# partition table must leave alone. One bit per 4 KiB of the boot
# partition, the slot and the storage partition.
CONFIG_MCUBOOT_UF2_ERASE_MAP_SIZE=512

# Info, not debug: the UF2 drive logs every sector at debug level, and
# the console is a 115200 baud UART written synchronously (minimal log
# mode), which held UF2 copies to about 70 KB/s.
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# The card in 32 KiB writes and erases instead of a read-modify-write of
# a 512 byte sector for each 256 byte UF2 payload
CONFIG_MCUBOOT_UF2_WRITE_BUFFER_SIZE=32768
CONFIG_FLASH_ON_DISK_ERASE_SECTORS=64

# A double reset is the only way into the drive by hand (the BOOT button
# is FEL's): a 1 s window after MCUboot starts, instead of 0.5 s, so a
# second press about half a second to a second after the first finds it.
# Every boot waits this long.
CONFIG_MCUBOOT_UF2_DOUBLE_TAP_DELAY=1000
